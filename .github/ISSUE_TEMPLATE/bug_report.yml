name: Bug report
description: WoR-flasher failed, or Windows will not boot on your Raspberry Pi
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        Please check these first, since they cover the most common problems:

        - [The ARMv8.1 limitation](https://github.com/Botspot/wor-flasher#the-armv81-limitation) - Windows 11 builds newer than 25163 cannot boot on a Pi 3 or Pi 4
        - [Troubleshooting](https://github.com/Botspot/wor-flasher#troubleshooting) - rainbow screen, freezing at the UEFI splash, dead keyboard
        - [Driver support](https://github.com/Botspot/wor-flasher#supported-devices) - Wi-Fi and GPU acceleration do not work on any model

  - type: dropdown
    id: interface
    attributes:
      label: Interface and runtime
      options:
        - Dioxus native Rust desktop
        - Native Rust CLI
        - Classic Bash CLI
        - Classic AppKit/yad GUI
    validations:
      required: true

  - type: dropdown
    id: image-family
    attributes:
      label: Image profile
      options:
        - Windows 10/11 desktop ARM64
        - Legacy Windows 10 IoT Core ARM32
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Where does it fail?
      options:
        - WoR-flasher exits with an error before finishing
        - Rainbow screen, the Pi never reaches the UEFI splash
        - UEFI splash appears, then it freezes
        - Windows setup starts but fails
        - Windows is installed, but something does not work
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Raspberry Pi model
      options:
        - Pi 4
        - Pi 400
        - Pi 5
        - Pi 3 B
        - Pi 3 B+
        - Pi 2 v1.2
        - Pi 2 v1.1 (legacy IoT Core ARM32 only)
        - Compute Module
        - Other
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: Windows build number
      description: Printed as `BID:` in the flash output, or shown in the `winfiles_*` folder name inside your download directory.
      placeholder: "22631.2861"
    validations:
      required: true

  - type: input
    id: uefi
    attributes:
      label: UEFI firmware version (desktop) or FFU build (IoT Core)
      description: For desktop, include the UEFI tag from the log. For legacy IoT Core, include the reviewed FFU build. Say "unknown" if preparation did not get that far.
      placeholder: "v1.52"
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host OS running WoR-Flasher
      placeholder: "macOS 27.2 or Raspberry Pi OS Bookworm; include host architecture"
    validations:
      required: true

  - type: input
    id: drive
    attributes:
      label: Drive being flashed
      description: Make, model and size. Slow SD cards are a common cause of failures.
      placeholder: "SanDisk Extreme 64GB microSD, A2"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, step by step, and what did you expect instead? Include enough detail that someone else could reproduce it.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Application logs or terminal output
      description: Include the saved native run log or classic terminal output, especially errors. Remove passwords, keys and other secrets before posting.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am not using a Windows 11 build newer than 25163 on a Pi 3 or Pi 4
          required: true
        - label: I re-ran the flasher with `USE_CACHE=0` to rule out stale cached components
          required: false
