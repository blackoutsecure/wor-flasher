name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "auto for the next patch, or an explicit vX.Y.Z tag"
        default: "auto"
        required: false
        type: string
      skip_project_version_update:
        description: "Do not update project version files before validating a new manual tag"
        default: false
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag_name) || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      create_tag: ${{ steps.release.outputs.create_tag }}
      ref: ${{ steps.release.outputs.ref }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SKIP_PROJECT_VERSION_UPDATE: ${{ inputs.skip_project_version_update }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ];then
            version="$(sed -n "s/^WOR_FLASHER_VERSION=['\"]\([^'\"]*\)['\"]$/\1/p" src/lib/metadata.sh)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Invalid version: $version" >&2
              exit 1
            }
            if [ "$INPUT_TAG" = auto ];then
              latest_tag=''
              while IFS= read -r candidate ;do
                if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]];then
                  latest_tag="$candidate"
                  break
                fi
              done < <(git tag --list 'v*' --sort=-version:refname)
              if [ -n "$latest_tag" ];then
                IFS=. read -r major minor patch <<< "${latest_tag#v}"
                tag="v$major.$minor.$((10#$patch + 1))"
              else
                tag="v$version"
              fi
            else
              tag="$INPUT_TAG"
            fi
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null ;then
              ref="refs/tags/$tag"
              create_tag=false
            else
              if [ "$SKIP_PROJECT_VERSION_UPDATE" != true ];then
                ./scripts/set-version.sh "${tag#v}"
                if [ -n "$(git status --porcelain -- src/lib/metadata.sh WoR-Flasher.app/Contents/Info.plist README.md install-wor.sh WoR-Flasher.app/Contents/Resources/runtime WoR-Flasher.app/Contents/Resources/runtime-manifest.json)" ];then
                  source_branch="${REF#refs/heads/}"
                  [ "$source_branch" != "$REF" ] || {
                    echo "Manual releases must run from a branch." >&2
                    exit 1
                  }
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add src/lib/metadata.sh WoR-Flasher.app/Contents/Info.plist README.md install-wor.sh \
                    WoR-Flasher.app/Contents/Resources/runtime \
                    WoR-Flasher.app/Contents/Resources/runtime-manifest.json
                  git commit -m "chore: prepare $tag"
                  git push origin "HEAD:$source_branch"
                fi
              fi
              SOURCE_SHA="$(git rev-parse HEAD)"
              ref="$SOURCE_SHA"
              create_tag=true
            fi
          else
            tag="$REF_NAME"
            ref="$REF"
            create_tag=false
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must be vX.Y.Z (got: $tag)." >&2
            exit 1
          }
          {
            echo "create_tag=$create_tag"
            echo "ref=$ref"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  validate-linux:
    name: Validate Linux release candidate
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Verify tag matches the release metadata
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n "s/^WOR_FLASHER_VERSION=['\"]\([^'\"]*\)['\"]$/\1/p" src/lib/metadata.sh)"
          [ -n "$version" ] || { echo 'WOR_FLASHER_VERSION is missing.' >&2; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $version" >&2; exit 1; }
          [ "$RELEASE_TAG" = "v$version" ] || { echo "Tag $RELEASE_TAG does not match v$version." >&2; exit 1; }

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Check shell syntax
        run: bash -n src/lib/*.sh install-wor.sh install-wor-gui.sh install-wor-hook.sh WoR-Flasher.app/Contents/MacOS/WoR-Flasher scripts/*.sh tests/*.sh

      - name: Check ShellCheck errors
        run: shellcheck --severity=error src/lib/*.sh install-wor.sh install-wor-gui.sh install-wor-hook.sh WoR-Flasher.app/Contents/MacOS/WoR-Flasher scripts/*.sh tests/*.sh

      - name: Verify packaged macOS runtime
        run: ./scripts/package-macos-app.sh --check

      - name: Run Linux test suite
        env:
          TEST_MODELS: "4"
          TEST_COMMAND_TIMEOUT: "120"
        run: ./tests/run-tests.sh

  validate-macos:
    name: Validate macOS release candidate
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Check shell syntax
        run: /bin/bash -n src/lib/*.sh install-wor.sh install-wor-gui.sh install-wor-hook.sh WoR-Flasher.app/Contents/MacOS/WoR-Flasher scripts/*.sh tests/*.sh

      - name: Verify packaged macOS runtime
        run: ./scripts/package-macos-app.sh --check

      - name: Run macOS test suite
        run: ./tests/run-tests.sh

  publish:
    name: Package and publish release
    needs:
      - prepare
      - validate-linux
      - validate-macos
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Create immutable release tag
        if: needs.prepare.outputs.create_tag == 'true'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null && {
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG" HEAD
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Package release artifacts
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n "s/^WOR_FLASHER_VERSION=['\"]\([^'\"]*\)['\"]$/\1/p" src/lib/metadata.sh)"
          archive_dir="$RUNNER_TEMP/release-artifacts"
          package_root="$RUNNER_TEMP/wor-flasher-$version"
          release_commit="$(git rev-parse HEAD)"
          mkdir -p "$archive_dir" "$package_root"
          git archive --format=tar "$release_commit" | tar -x -C "$package_root"
          ditto -c -k --keepParent "$package_root" "$archive_dir/wor-flasher-$version-linux-rpi.zip"
          ditto -c -k --keepParent WoR-Flasher.app "$archive_dir/WoR-Flasher-$version-macos.zip"
          tar -czf "$archive_dir/macos-runtime-$version.tar.gz" \
            -C WoR-Flasher.app/Contents/Resources runtime runtime-manifest.json
          runtime_digest="$(shasum -a 256 "$archive_dir/macos-runtime-$version.tar.gz" | awk '{print $1}')"
          printf '{\n  "version": "%s",\n  "url": "https://github.com/%s/releases/download/%s/macos-runtime-%s.tar.gz",\n  "sha256": "%s"\n}\n' \
            "$version" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$version" "$runtime_digest" > "$archive_dir/macos-runtime.json"
          (
            cd "$archive_dir"
            shasum -a 256 wor-flasher-"$version"-linux-rpi.zip WoR-Flasher-"$version"-macos.zip \
              macos-runtime-"$version".tar.gz macos-runtime.json > SHA256SUMS
          )
          {
            echo "directory=$archive_dir"
            echo "commit=$release_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ steps.package.outputs.commit }}
          generate_release_notes: true
          body: |
            `wor-flasher-*-linux-rpi.zip` is the portable Bash distribution for Debian, Ubuntu,
            Raspberry Pi OS, and other supported Linux hosts. It is also the complete release source.

            The `WoR-Flasher-*-macos.zip` application bundle is unsigned and unnotarized.
            `macos-runtime.json` and its versioned runtime archive are consumed only by the macOS
            launcher's verified runtime updater.

            Verify downloaded artifacts against `SHA256SUMS` before use.
          files: |
            ${{ steps.package.outputs.directory }}/wor-flasher-*-linux-rpi.zip
            ${{ steps.package.outputs.directory }}/WoR-Flasher-*-macos.zip
            ${{ steps.package.outputs.directory }}/macos-runtime-*.tar.gz
            ${{ steps.package.outputs.directory }}/macos-runtime.json
            ${{ steps.package.outputs.directory }}/SHA256SUMS
          fail_on_unmatched_files: true
