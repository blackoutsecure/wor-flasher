name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "auto for the next patch, or an explicit vX.Y.Z tag"
        default: "auto"
        required: false
        type: string
      skip_project_version_update:
        description: "Do not update project version files before validating a new manual tag"
        default: false
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag_name) || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      create_tag: ${{ steps.release.outputs.create_tag }}
      ref: ${{ steps.release.outputs.ref }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SKIP_PROJECT_VERSION_UPDATE: ${{ inputs.skip_project_version_update }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ];then
            version="$(node -p 'require("./src/config/metadata.json").product.version')"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Invalid version: $version" >&2
              exit 1
            }
            if [ "$INPUT_TAG" = auto ];then
              latest_tag=''
              while IFS= read -r candidate ;do
                if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]];then
                  latest_tag="$candidate"
                  break
                fi
              done < <(git tag --list 'v*' --sort=-version:refname)
              if [ -n "$latest_tag" ];then
                IFS=. read -r major minor patch <<< "${latest_tag#v}"
                tag="v$major.$minor.$((10#$patch + 1))"
              else
                tag="v$version"
              fi
            else
              tag="$INPUT_TAG"
            fi
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null ;then
              ref="refs/tags/$tag"
              create_tag=false
            else
              if [ "$SKIP_PROJECT_VERSION_UPDATE" != true ];then
                node src/set-version.mjs "${tag#v}"
                if [ -n "$(git status --porcelain -- src/config/metadata.json package.json)" ];then
                  source_branch="${REF#refs/heads/}"
                  [ "$source_branch" != "$REF" ] || {
                    echo "Manual releases must run from a branch." >&2
                    exit 1
                  }
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add src/config/metadata.json package.json
                  git commit -m "chore: prepare $tag" \
                    -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
                  git push origin "HEAD:$source_branch"
                fi
              fi
              SOURCE_SHA="$(git rev-parse HEAD)"
              ref="$SOURCE_SHA"
              create_tag=true
            fi
          else
            tag="$REF_NAME"
            ref="$REF"
            create_tag=false
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must be vX.Y.Z (got: $tag)." >&2
            exit 1
          }
          {
            echo "create_tag=$create_tag"
            echo "ref=$ref"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  validate-linux:
    name: Validate Linux release candidate (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - name: Verify tag matches the release metadata
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./src/config/metadata.json").product.version')"
          [ -n "$version" ] || { echo 'WOR_FLASHER_VERSION is missing.' >&2; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $version" >&2; exit 1; }
          [ "$RELEASE_TAG" = "v$version" ] || { echo "Tag $RELEASE_TAG does not match v$version." >&2; exit 1; }

      - name: Install native desktop build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev

      - name: Verify release packaging plan
        run: npm run check

      - name: Check Rust formatting and native logic
        run: |
          set -euo pipefail
          rustup show
          cargo fmt --all -- --check
          cargo test --locked --workspace --exclude wor-desktop
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p wor-desktop --features visual-fixtures --bin wor-desktop
          cargo clippy --locked -p wor-desktop --features visual-fixtures --all-targets -- -D warnings

      - name: Validate and stage the native Rust release package
        run: |
          set -euo pipefail
          node src/package-rust.mjs --desktop --check
          node src/package-rust.mjs --desktop

      - name: Archive the native Rust package
        id: native-package
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          target="$(node -p 'process.platform + "-" + process.arch')"
          archive="$RUNNER_TEMP/wor-flasher-${RELEASE_VERSION#v}-${target}.tar.gz"
          tar -czf "$archive" -C "release/rust/$target" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload the native Rust package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wor-flasher-rust-linux-${{ matrix.arch }}
          path: ${{ steps.native-package.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

  validate-macos:
    name: Validate macOS release candidate
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - name: Verify release packaging plan
        run: npm run check

      - name: Check Rust formatting and native logic
        run: |
          set -euo pipefail
          rustup show
          cargo fmt --all -- --check
          cargo test --locked --workspace --exclude wor-desktop
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p wor-desktop --features visual-fixtures --bin wor-desktop
          cargo clippy --locked -p wor-desktop --features visual-fixtures --all-targets -- -D warnings

      - name: Validate and stage the native Rust release package
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          node src/package-rust.mjs --desktop --universal --check
          node src/package-rust.mjs --desktop --universal

      - name: Archive the native Rust package
        id: native-package
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          target=darwin-universal
          archive="$RUNNER_TEMP/wor-flasher-${RELEASE_VERSION#v}-${target}.tar.gz"
          tar -czf "$archive" -C "release/rust/$target" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload the native Rust package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wor-flasher-rust-macos
          path: ${{ steps.native-package.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Package and publish release
    needs:
      - prepare
      - validate-linux
      - validate-macos
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download validated native Rust packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wor-flasher-rust-*
          path: ${{ runner.temp }}/native-packages
          merge-multiple: true

      - name: Package release artifacts
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./src/config/metadata.json").product.version')"
          archive_dir="$RUNNER_TEMP/release-artifacts"
          release_commit="$(git rev-parse HEAD)"
          mkdir -p "$archive_dir"
          find "$RUNNER_TEMP/native-packages" -type f -name "wor-flasher-$version-*.tar.gz" -exec cp {} "$archive_dir/" \;
          package_count="$(find "$archive_dir" -type f -name "wor-flasher-$version-*.tar.gz" | wc -l | tr -d '[:space:]')"
          [ "$package_count" = 3 ] || {
            echo "Expected the validated Linux x64, Linux ARM64 and universal macOS Rust packages; found $package_count." >&2
            exit 1
          }
          for target in linux-x64 linux-arm64 darwin-universal; do
            [ -s "$archive_dir/wor-flasher-$version-$target.tar.gz" ] || {
              echo "Missing validated package: $target" >&2
              exit 1
            }
          done
          (
            cd "$archive_dir"
            shasum -a 256 wor-flasher-"$version"-*.tar.gz > SHA256SUMS
          )
          {
            echo "directory=$archive_dir"
            echo "commit=$release_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Create immutable release tag
        if: needs.prepare.outputs.create_tag == 'true'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null && {
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG" HEAD
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ steps.package.outputs.commit }}
          generate_release_notes: true
          body: |
            The primary releases are native Rust CLI and Dioxus desktop packages for Linux and macOS.
            Download the matching `wor-flasher-<version>-<platform>-<architecture>.tar.gz`, verify
            it with `SHA256SUMS`, then follow its `README.txt`. Linux x64 and ARM64 packages include
            `bin/wor-flasher` and `bin/wor-desktop`; the macOS package also includes the
            `WoR-Flasher.app` bundle with Intel and Apple Silicon slices in both executables.
            All packages include the verified native runtime, exact source
            snapshot, dependency notices and package checksums. No Bash, Python or Node host runtime
            is needed to run the native application.

            Native physical writes remain explicitly experimental and require the documented
            opt-in and erase consent. Automated checks do not qualify physical media or Raspberry
            Pi boot compatibility. The Rust Pi 3 on-device helper is not promoted; the existing
            qualified helper remains in use. macOS bundles are unsigned and unnotarized. See README
            and NOTICE for host requirements, limitations and attribution.
          files: |
            ${{ steps.package.outputs.directory }}/wor-flasher-*.tar.gz
            ${{ steps.package.outputs.directory }}/SHA256SUMS
          fail_on_unmatched_files: true
