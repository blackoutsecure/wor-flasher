name: ShellCheck

on:
  push:
    paths:
      - "**.sh"
      - "terminal-run"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**.sh"
      - "terminal-run"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      # Errors fail the build. The scripts are clean at this level today.
      - name: Check for errors
        run: shellcheck --severity=error install-wor.sh install-wor-gui.sh terminal-run

      - name: Report warnings
        continue-on-error: true
        run: shellcheck --severity=warning install-wor.sh install-wor-gui.sh terminal-run
