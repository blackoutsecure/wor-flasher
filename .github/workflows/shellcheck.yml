name: ShellCheck and Tests

on:
  push:
    paths:
      - "**.sh"
      - "assets/**"
      - "config-templates/**"
      - "WoR-Flasher.app/**"
      - ".github/workflows/shellcheck.yml"
      - "README.md"
  pull_request:
    paths:
      - "**.sh"
      - "assets/**"
      - "config-templates/**"
      - "WoR-Flasher.app/**"
      - ".github/workflows/shellcheck.yml"
      - "README.md"
  workflow_dispatch:
    inputs:
      test_models:
        description: "Raspberry Pi models to exercise in the dry-run integration suite"
        default: "4"
        required: true
      test_command_timeout:
        description: "Per-command timeout in seconds for the dry-run integration suite"
        default: "120"
        required: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Check shell syntax
        run: bash -n src/lib/*.sh install-wor.sh install-wor-gui.sh install-wor-hook.sh WoR-Flasher.app/Contents/MacOS/WoR-Flasher scripts/*.sh tests/*.sh

      - name: Check for errors
        run: shellcheck --severity=error src/lib/*.sh install-wor.sh install-wor-gui.sh install-wor-hook.sh WoR-Flasher.app/Contents/MacOS/WoR-Flasher scripts/*.sh tests/*.sh

      - name: Report warnings
        continue-on-error: true
        run: shellcheck --severity=warning src/lib/*.sh install-wor.sh install-wor-gui.sh install-wor-hook.sh WoR-Flasher.app/Contents/MacOS/WoR-Flasher scripts/*.sh tests/*.sh

      - name: Verify packaged macOS runtime
        run: ./scripts/package-macos-app.sh --check

  macos-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check syntax with the macOS system Bash
        run: /bin/bash -n src/lib/*.sh install-wor.sh install-wor-gui.sh install-wor-hook.sh WoR-Flasher.app/Contents/MacOS/WoR-Flasher scripts/*.sh tests/*.sh

      - name: Verify packaged macOS runtime
        run: ./scripts/package-macos-app.sh --check

      # bash -n accepts a mis-parsed heredoc, so the suite must also run here to catch
      # structural breakage in the macOS-only JXA code paths
      - name: Run the test suite on macOS
        run: ./tests/run-tests.sh

  dry-run-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Run one-model dry-run integration suite
        env:
          TEST_MODELS: ${{ inputs.test_models || '4' }}
          TEST_COMMAND_TIMEOUT: ${{ inputs.test_command_timeout || '120' }}
        run: ./tests/run-tests.sh
