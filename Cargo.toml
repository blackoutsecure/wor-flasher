[workspace]
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/ffu",
    "crates/iot-media",
    "crates/iot-account",
    "crates/desktop-media",
    "apps/cli",
    "apps/desktop",
    "apps/pi3-boot-refresh",
]
default-members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/ffu",
    "crates/iot-media",
    "crates/iot-account",
    "crates/desktop-media",
    "apps/cli",
    "apps/pi3-boot-refresh",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "string"] }
crc32fast = "1"
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal"] }
dioxus-ssr = "=0.7.10"
fs2 = "0.4"
libc = "0.2"
nix = { version = "0.30", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wor-domain = { path = "crates/domain" }
wor-application = { path = "crates/application" }
wor-infrastructure = { path = "crates/infrastructure" }
wor-ffu = { path = "crates/ffu" }
wor-iot-media = { path = "crates/iot-media" }
wor-iot-account = { path = "crates/iot-account" }
wor-desktop-media = { path = "crates/desktop-media" }
wor-pi3-boot-refresh = { path = "apps/pi3-boot-refresh" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
lto = "thin"
strip = true
