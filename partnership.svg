<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Blackout Secure and Botspot, joining forces on WoR-Flasher</title>
  <desc id="desc">A banner showing the Botspot project and Blackout Secure linked together, with the WoR-Flasher tagline: Windows on a Raspberry Pi, from Linux or macOS.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1721"/>
      <stop offset="55%" stop-color="#0d2531"/>
      <stop offset="100%" stop-color="#07131b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a7ea4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0a7ea4"/>
    </linearGradient>
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="440" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="18" fill="url(#grid)"/>
  <circle cx="300" cy="215" r="210" fill="url(#glowL)"/>
  <circle cx="900" cy="215" r="210" fill="url(#glowR)"/>

  <!-- ===== left node: Botspot / the original project ===== -->
  <g transform="translate(180 150)">
    <circle cx="60" cy="60" r="74" fill="#0f2c3a" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2"/>
    <!-- raspberry -->
    <g transform="translate(60 62)">
      <path d="M-9 -30 C-16 -42 -2 -44 2 -34" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
      <path d="M9 -30 C16 -42 2 -44 -2 -34" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
      <g fill="#e2415f">
        <circle cx="-12" cy="-14" r="9"/><circle cx="0" cy="-19" r="9"/><circle cx="12" cy="-14" r="9"/>
        <circle cx="-17" cy="-1" r="9"/><circle cx="-6" cy="-4" r="9"/><circle cx="6" cy="-4" r="9"/><circle cx="17" cy="-1" r="9"/>
        <circle cx="-11" cy="11" r="9"/><circle cx="0" cy="14" r="9"/><circle cx="11" cy="11" r="9"/>
        <circle cx="-5" cy="25" r="8"/><circle cx="5" cy="25" r="8"/>
      </g>
    </g>
    <text x="60" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6f4f9">Botspot</text>
    <text x="60" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8fb6c6">created WoR-Flasher</text>
  </g>

  <!-- ===== centre: the link ===== -->
  <g transform="translate(600 212)">
    <line x1="-236" y1="0" x2="-64" y2="0" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
    <line x1="64" y1="0" x2="236" y2="0" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
    <circle cx="0" cy="0" r="56" fill="#0b2230" stroke="url(#accent)" stroke-width="3"/>
    <!-- interlocking links -->
    <g fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round">
      <path d="M-24 -8 a16 16 0 0 1 0 -22 h14 a16 16 0 0 1 0 22"/>
      <path d="M10 8 a16 16 0 0 0 0 22 h14 a16 16 0 0 0 0 -22"/>
      <path d="M-10 2 h20" stroke="#4ade80"/>
    </g>
    <text x="0" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#38bdf8">better together</text>
  </g>

  <!-- ===== right node: Blackout Secure ===== -->
  <g transform="translate(840 150)">
    <circle cx="60" cy="60" r="74" fill="#0f2c3a" stroke="#4ade80" stroke-opacity="0.55" stroke-width="2"/>
    <!-- shield with a window -->
    <g transform="translate(60 60)">
      <path d="M0 -36 L30 -25 V4 C30 22 16 32 0 38 C-16 32 -30 22 -30 4 V-25 Z" fill="#0a7ea4" fill-opacity="0.25" stroke="#4ade80" stroke-width="4" stroke-linejoin="round"/>
      <g stroke="#e6f4f9" stroke-width="3.5" stroke-linecap="round">
        <path d="M-13 -8 H13"/><path d="M0 -19 V6"/>
        <path d="M-13 -19 H13 V6 H-13 Z" fill="none"/>
      </g>
    </g>
    <text x="60" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6f4f9">BlackOut Secure</text>
    <text x="60" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8fb6c6">offering to help maintain it</text>
  </g>

  <!-- ===== header + footer text ===== -->
  <text x="600" y="62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="700" fill="#e6f4f9">WoR-Flasher</text>
  <text x="600" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#8fb6c6">Windows on a Raspberry Pi &#8212; now from Linux <tspan fill="#4ade80">and</tspan> macOS</text>

  <rect x="0" y="386" width="1200" height="54" fill="#08161e" fill-opacity="0.85"/>
  <rect x="0" y="386" width="1200" height="2" fill="url(#accent)"/>
  <text x="600" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#8fb6c6">
    supporting the <tspan fill="#e6f4f9">Botspot</tspan> and <tspan fill="#e6f4f9">Windows on Raspberry</tspan> communities
  </text>
</svg>
